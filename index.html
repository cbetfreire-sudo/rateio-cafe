<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">

  <title>Rateio do Café — Extrato da Equipe</title>

  <style>
    :root {
      --azul-escuro: #0b3d6e;
      --azul-principal: #155e9e;
      --azul-medio: #1976c5;
      --azul-claro: #dceeff;
      --azul-muito-claro: #f1f7fc;
      --cor-fundo: #f4f8fc;
      --cor-texto: #1f2937;
      --cor-texto-suave: #60758a;
      --cor-borda: #d7e3ef;
      --cor-sucesso: #13795b;
      --cor-alerta: #a15c00;
      --cor-erro: #a52828;
      --sombra: 0 10px 30px rgba(21, 94, 158, 0.10);
      --raio: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cor-fundo);
      color: var(--cor-texto);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 36px 0 32px;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          rgba(11, 61, 110, 0.98),
          rgba(21, 94, 158, 0.95)
        );
    }

    .titulo-site {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .titulo-site h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      letter-spacing: -0.04em;
    }

    .titulo-site p {
      margin: 0;
      color: rgba(255, 255, 255, 0.84);
    }

    .imagem-cafe {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      object-fit: contain;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
      padding: 5px;
    }

    .barra-controles {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 16px;
      margin-top: 28px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo label {
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.82rem;
      font-weight: 700;
    }

    select,
    button {
      min-height: 42px;
      border-radius: 10px;
      border: 1px solid var(--cor-borda);
      font: inherit;
    }

    select {
      min-width: 230px;
      padding: 0 12px;
      background: #fff;
      color: var(--cor-texto);
    }

    button {
      padding: 0 18px;
      cursor: pointer;
      border-color: rgba(255, 255, 255, 0.35);
      background: #fff;
      color: var(--azul-escuro);
      font-weight: 700;
    }

    button:hover {
      background: var(--azul-muito-claro);
    }

    main {
      padding: 32px 0 48px;
    }

    .mensagem {
      display: none;
      margin-bottom: 24px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid;
    }

    .mensagem.visivel {
      display: block;
    }

    .mensagem.erro {
      color: var(--cor-erro);
      border-color: #e5b6b6;
      background: #fff3f3;
    }

    .mensagem.aviso {
      color: var(--cor-alerta);
      border-color: #ead2a7;
      background: #fff8e9;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .status h2 {
      margin: 0;
      font-size: 1.45rem;
    }

    .status-info {
      color: var(--cor-texto-suave);
      font-size: 0.95rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge.aberto {
      color: var(--cor-sucesso);
      background: #e8f5ef;
    }

    .badge.fechado {
      color: var(--cor-texto-suave);
      background: #eeeeee;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio);
      background: #fff;
      box-shadow: var(--sombra);
    }

    .card.destaque {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(
        135deg,
        var(--azul-escuro),
        var(--azul-medio)
      );
    }

    .card-titulo {
      margin-bottom: 8px;
      color: var(--cor-texto-suave);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .card.destaque .card-titulo {
      color: rgba(255, 255, 255, 0.78);
    }

    .card-valor {
      overflow-wrap: anywhere;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .grid-conteudo {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      margin-bottom: 24px;
    }

    .secao {
      min-width: 0;
      padding: 22px;
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio);
      background: #fff;
      box-shadow: var(--sombra);
    }

    .secao h3 {
      margin: 0 0 18px;
      color: var(--azul-escuro);
      font-size: 1.18rem;
    }

    .secao-descricao {
      margin: -8px 0 18px;
      color: var(--cor-texto-suave);
      font-size: 0.9rem;
    }

    .tabela-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--cor-borda);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      color: var(--cor-texto-suave);
      background: var(--azul-muito-claro);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    td.valor,
    th.valor {
      text-align: right;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .estado {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .estado.pago {
      color: var(--cor-sucesso);
      background: #e8f5ef;
    }

    .estado.pendente {
      color: var(--cor-alerta);
      background: #fff2d9;
    }

    .vazio,
    .carregando {
      padding: 20px 0 4px;
      color: var(--cor-texto-suave);
      text-align: center;
    }

    .pix-section {
      margin-top: 24px;
      text-align: center;
    }

    .pix-section h3 {
      margin-bottom: 8px;
    }

    .pix-descricao {
      margin: 0 0 18px;
      color: var(--cor-texto-suave);
    }

    .imagem-pix {
      display: block;
      width: 220px;
      height: 220px;
      max-width: 100%;
      margin: 0 auto;
      object-fit: contain;
      border: 1px solid var(--cor-borda);
      border-radius: 12px;
      background: #fff;
      padding: 8px;
    }

    .pix-indisponivel {
      display: none;
      margin: 0;
      color: var(--cor-texto-suave);
      font-size: 0.9rem;
    }

    footer {
      padding: 24px 0 36px;
      color: var(--cor-texto-suave);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid-conteudo {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .container {
        width: min(100% - 22px, 1180px);
      }

      .titulo-site {
        align-items: flex-start;
      }

      .imagem-cafe {
        width: 46px;
        height: 46px;
        flex-basis: 46px;
      }

      .titulo-site h1 {
        font-size: 1.65rem;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .barra-controles {
        align-items: stretch;
        flex-direction: column;
      }

      select,
      button {
        width: 100%;
      }

      .secao {
        padding: 16px;
      }

      .imagem-pix {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="titulo-site">
        <img
          id="imagem-cafe"
          class="imagem-cafe"
          src="data/caneca-cafe.png"
          alt="Imagem de uma xícara de café"
        >

        <div>
          <h1>Rateio do Melhor Café do CCEM</h1>
          <p>Extrato público de arrecadação e gastos da equipe.</p>
        </div>
      </div>

      <div class="barra-controles">
        <div class="campo">
          <label for="seletor-mes">Mês de referência</label>

          <select id="seletor-mes" aria-label="Selecionar mês">
            <option value="">Carregando meses...</option>
          </select>
        </div>

        <button id="botao-atualizar" type="button">
          Atualizar dados
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="mensagem-erro" class="mensagem erro" role="alert"></div>
    <div id="mensagem-aviso" class="mensagem aviso" role="status"></div>

    <section id="area-conteudo" aria-live="polite">
      <p class="carregando">Carregando informações...</p>
    </section>
  </main>

  <footer>
    Rateio do Café —
    Centro de Comunicação Estratégica da Marinha —
    dados lidos da pasta <code>/data</code>
  </footer>

  <script>
    'use strict';

    const CAMINHOS_INDICE = [
      'data/index.json',
      'data/index.txt'
    ];

    const CAMINHOS_IMAGEM_CAFE = [
      'data/caneca-cafe.png',
      'data/caneca-cafe.jpg',
      'data/caneca-cafe.jpeg',
      'data/caneca-cafe.webp',
      'data/xicara-cafe.png',
      'data/xicara-cafe.jpg',
      'data/cafe.png',
      'data/cafe.jpg'
    ];

    const estadoAplicacao = {
      indice: null,
      dadosMes: null,
      arquivoAtual: null
    };

    const elementos = {
      seletorMes: document.querySelector('#seletor-mes'),
      botaoAtualizar: document.querySelector('#botao-atualizar'),
      areaConteudo: document.querySelector('#area-conteudo'),
      mensagemErro: document.querySelector('#mensagem-erro'),
      mensagemAviso: document.querySelector('#mensagem-aviso'),
      imagemCafe: document.querySelector('#imagem-cafe')
    };

    function converterNumero(valor) {
      if (valor === null || valor === undefined || valor === '') {
        return 0;
      }

      if (typeof valor === 'string') {
        valor = valor.trim();

        if (valor === '') {
          return 0;
        }

        if (valor.includes(',') && !valor.includes('.')) {
          valor = valor.replace(',', '.');
        }
      }

      const numero = Number(valor);

      return Number.isFinite(numero) ? numero : 0;
    }

    function valorFoiInformado(valor) {
      return !(
        valor === null ||
        valor === undefined ||
        (typeof valor === 'string' && valor.trim() === '')
      );
    }

    function formatarMoeda(valor) {
      return converterNumero(valor).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function escaparHtml(valor) {
      return String(valor ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('&lt;', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function mostrarErro(mensagem) {
      elementos.mensagemErro.textContent = mensagem;
      elementos.mensagemErro.classList.add('visivel');
    }

    function limparErro() {
      elementos.mensagemErro.textContent = '';
      elementos.mensagemErro.classList.remove('visivel');
    }

    function mostrarAviso(mensagem) {
      elementos.mensagemAviso.textContent = mensagem;
      elementos.mensagemAviso.classList.add('visivel');
    }

    function limparAviso() {
      elementos.mensagemAviso.textContent = '';
      elementos.mensagemAviso.classList.remove('visivel');
    }

    async function obterJson(caminho) {
      const resposta = await fetch(caminho, {
        cache: 'no-store'
      });

      if (!resposta.ok) {
        throw new Error(
          `Não foi possível carregar ${caminho}. HTTP ${resposta.status}.`
        );
      }

      const texto = await resposta.text();

      try {
        return JSON.parse(texto);
      } catch {
        throw new Error(
          `O arquivo ${caminho} não contém um JSON válido.`
        );
      }
    }

    async function carregarPrimeiroJsonDisponivel(caminhos) {
      let ultimoErro = null;

      for (const caminho of caminhos) {
        try {
          const json = await obterJson(caminho);

          return {
            json,
            caminho
          };
        } catch (erro) {
          ultimoErro = erro;
        }
      }

      throw ultimoErro || new Error(
        'Nenhum arquivo JSON disponível.'
      );
    }

    function obterCaminhosDoArquivo(arquivo) {
      if (!arquivo) {
        return [];
      }

      const caminhos = [arquivo];

      if (arquivo.endsWith('.json')) {
        caminhos.push(
          arquivo.replace(/\.json$/i, '.txt')
        );
      } else if (arquivo.endsWith('.txt')) {
        caminhos.push(
          arquivo.replace(/\.txt$/i, '.json')
        );
      }

      return [...new Set(caminhos)];
    }

    function configurarImagemCafe(caminhoPreferencial) {
      const imagem = elementos.imagemCafe;

      if (!imagem) {
        return;
      }

      const caminhos = [
        caminhoPreferencial,
        ...CAMINHOS_IMAGEM_CAFE
      ].filter(Boolean);

      const caminhosUnicos = [...new Set(caminhos)];
      let indice = 0;

      function tentarProximoCaminho() {
        if (indice >= caminhosUnicos.length) {
          imagem.style.display = 'none';
          return;
        }

        imagem.src = caminhosUnicos[indice];
        indice += 1;
      }

      imagem.addEventListener(
        'error',
        tentarProximoCaminho
      );

      imagem.addEventListener(
        'load',
        () => {
          imagem.style.display = 'block';
        }
      );

      tentarProximoCaminho();
    }

    function configurarImagemPix() {
      const imagemPix = document.querySelector('#imagem-pix');
      const mensagem = document.querySelector('#pix-indisponivel');

      if (!imagemPix || !mensagem) {
        return;
      }

      imagemPix.addEventListener('error', () => {
        imagemPix.style.display = 'none';
        mensagem.style.display = 'block';
      });
    }

    function validarIndice(indice) {
      return Boolean(
        indice &&
        Array.isArray(indice.meses)
      );
    }

    function validarDadosMes(dados) {
      return Boolean(
        dados &&
        typeof dados === 'object' &&
        !Array.isArray(dados)
      );
    }

    function preencherSeletorMes(meses) {
      elementos.seletorMes.innerHTML = '';

      if (!Array.isArray(meses) || meses.length === 0) {
        elementos.seletorMes.innerHTML =
          '<option value="">Nenhum mês encontrado</option>';

        return;
      }

      meses.forEach((mes, indice) => {
        const option = document.createElement('option');

        option.value = String(indice);
        option.textContent =
          mes.label ||
          mes.ref ||
          `Mês ${indice + 1}`;

        elementos.seletorMes.appendChild(option);
      });

      elementos.seletorMes.value = '0';
    }

    function obterValorPago(contribuinte) {
      /*
       * O valor zero é válido.
       * Não utilizar:
       *
       * contribuinte.valor_pago || contribuinte.cota_sugerida
       */
      if (valorFoiInformado(contribuinte.valor_pago)) {
        return converterNumero(contribuinte.valor_pago);
      }

      return 0;
    }

    function obterListaContribuintesItens(dados) {
      if (Array.isArray(dados.contribuintes_itens)) {
        return dados.contribuintes_itens;
      }

      if (Array.isArray(dados.contribuintes_utensilios)) {
        return dados.contribuintes_utensilios;
      }

      return [];
    }

    function normalizarContribuinteItem(registro) {
      if (typeof registro === 'string') {
        return {
          nome: registro,
          item: '',
          data: ''
        };
      }

      return {
        nome: registro?.nome || registro?.contribuinte || '',
        item: registro?.item || registro?.utensilio || registro?.descrição || '',
        data: registro?.data || ''
      };
    }

    function calcularResumo(dados) {
      const saldoAnterior = converterNumero(
        dados.saldo_anterior
      );

      const contribuintes = Array.isArray(
        dados.contribuintes
      )
        ? dados.contribuintes
        : [];

      const gastos = Array.isArray(dados.gastos)
        ? dados.gastos
        : [];

      const totalContribuicoes = contribuintes.reduce(
        (total, contribuinte) => {
          if (
            !contribuinte ||
            contribuinte.pago !== true
          ) {
            return total;
          }

          return total + obterValorPago(contribuinte);
        },
        0
      );

      const totalGastos = gastos.reduce(
        (total, gasto) => {
          if (!gasto) {
            return total;
          }

          return total + converterNumero(
            gasto.valor_total
          );
        },
        0
      );

      const saldoAtual =
        saldoAnterior +
        totalContribuicoes -
        totalGastos;

      return {
        saldoAnterior,
        totalContribuicoes,
        totalGastos,
        saldoAtual
      };
    }

    function renderizarResumo(dados, resumo) {
      const status = dados.status || 'não informado';

      const statusClasse =
        status.toLowerCase() === 'aberto'
          ? 'aberto'
          : 'fechado';

      const responsavel =
        dados.responsavel_caixa || 'Não informado';

      return `
        <div class="status">
          <div>
            <h2>
              ${escaparHtml(
                dados.label ||
                dados.mes_referencia ||
                'Extrato'
              )}
            </h2>

            <div class="status-info">
              Responsável pelo caixa:
              <strong>${escaparHtml(responsavel)}</strong>
            </div>
          </div>

          <span class="badge ${statusClasse}">
            ${escaparHtml(status)}
          </span>
        </div>

        <div class="cards">
          <article class="card">
            <div class="card-titulo">Saldo anterior</div>
            <div class="card-valor">
              ${formatarMoeda(resumo.saldoAnterior)}
            </div>
          </article>

          <article class="card">
            <div class="card-titulo">Contribuições</div>
            <div class="card-valor">
              ${formatarMoeda(resumo.totalContribuicoes)}
            </div>
          </article>

          <article class="card">
            <div class="card-titulo">Gastos</div>
            <div class="card-valor">
              ${formatarMoeda(resumo.totalGastos)}
            </div>
          </article>

          <article class="card destaque">
            <div class="card-titulo">Saldo atual</div>
            <div class="card-valor">
              ${formatarMoeda(resumo.saldoAtual)}
            </div>
          </article>
        </div>
      `;
    }

    function renderizarContribuintes(contribuintes) {
      if (
        !Array.isArray(contribuintes) ||
        contribuintes.length === 0
      ) {
        return `
          <section class="secao">
            <h3>Contribuintes financeiros</h3>

            <div class="vazio">
              Nenhum contribuinte cadastrado.
            </div>
          </section>
        `;
      }

      const linhas = contribuintes.map((contribuinte) => {
        const pago = contribuinte.pago === true;

        const valorPago = obterValorPago(
          contribuinte
        );

        const cotaSugerida = converterNumero(
          contribuinte.cota_sugerida
        );

        return `
          <tr>
            <td>
              ${escaparHtml(
                contribuinte.nome ||
                'Não informado'
              )}
            </td>

            <td class="valor">
              ${formatarMoeda(cotaSugerida)}
            </td>

            <td class="valor">
              ${formatarMoeda(valorPago)}
            </td>

            <td>
              <span class="estado ${pago ? 'pago' : 'pendente'}">
                ${pago ? 'Pago' : 'Pendente'}
              </span>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <section class="secao">
          <h3>Contribuintes financeiros</h3>

          <div class="tabela-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th class="valor">Cota sugerida</th>
                  <th class="valor">Valor pago</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody>
                ${linhas}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderizarContribuintesItens(dados) {
      const registros = obterListaContribuintesItens(
        dados
      );

      if (registros.length === 0) {
        return `
          <section class="secao">
            <h3>Contribuintes de itens e utensílios</h3>

            <p class="secao-descricao">
              Pessoas que levaram algum item ou utensílio
              durante o mês.
            </p>

            <div class="vazio">
              Nenhum item ou utensílio registrado neste mês.
            </div>
          </section>
        `;
      }

      const linhas = registros.map((registro) => {
        const item = normalizarContribuinteItem(
          registro
        );

        return `
          <tr>
            <td>
              ${escaparHtml(
                item.nome || 'Não informado'
              )}
            </td>

            <td>
              ${escaparHtml(
                item.item || 'Não informado'
              )}
            </td>

            <td>
              ${escaparHtml(
                item.data || 'Não informado'
              )}
            </td>
          </tr>
        `;
      }).join('');

      return `
        <section class="secao">
          <h3>Contribuintes de itens e utensílios</h3>

          <p class="secao-descricao">
            Pessoas que levaram algum item ou utensílio
            durante o mês.
          </p>

          <div class="tabela-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Contribuinte</th>
                  <th>Item ou utensílio</th>
                  <th>Data</th>
                </tr>
              </thead>

              <tbody>
                ${linhas}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderizarGastos(gastos) {
      if (
        !Array.isArray(gastos) ||
        gastos.length === 0
      ) {
        return `
          <section class="secao">
            <h3>Gastos</h3>

            <div class="vazio">
              Nenhum gasto cadastrado.
            </div>
          </section>
        `;
      }

      const linhas = gastos.map((gasto) => {
        return `
          <tr>
            <td>
              ${escaparHtml(
                gasto.data || 'Não informado'
              )}
            </td>

            <td>
              ${escaparHtml(
                gasto.item || 'Não informado'
              )}
            </td>

            <td>
              ${escaparHtml(
                gasto.local || 'Não informado'
              )}
            </td>

            <td class="valor">
              ${formatarMoeda(gasto.valor_total)}
            </td>
          </tr>
        `;
      }).join('');

      return `
        <section class="secao">
          <h3>Gastos</h3>

          <div class="tabela-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Item</th>
                  <th>Local</th>
                  <th class="valor">Valor</th>
                </tr>
              </thead>

              <tbody>
                ${linhas}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderizarPix() {
      return `
        <section class="secao pix-section">
          <h3>Contribuições via Pix</h3>

          <p class="pix-descricao">
            Aponte a câmera do celular para o QR Code
            para realizar uma contribuição.
          </p>

          <img
            id="imagem-pix"
            class="imagem-pix"
            src="data/pix.png"
            alt="QR Code da chave Pix para contribuições"
          >

          <p id="pix-indisponivel" class="pix-indisponivel">
            QR Code Pix não encontrado em
            <strong>data/pix.png</strong>.
          </p>
        </section>
      `;
    }

    function renderizarPagina(dados) {
      const resumo = calcularResumo(dados);

      elementos.areaConteudo.innerHTML = `
        ${renderizarResumo(dados, resumo)}

        <div class="grid-conteudo">
          ${renderizarContribuintes(dados.contribuintes)}
          ${renderizarGastos(dados.gastos)}
        </div>

        <div class="grid-conteudo">
          ${renderizarContribuintesItens(dados)}
        </div>

        ${renderizarPix()}
      `;

      configurarImagemCafe(
        dados.imagem_cabecalho ||
        'data/caneca-cafe.png'
      );

      configurarImagemPix();
    }

    async function carregarIndice() {
      limparErro();
      limparAviso();

      try {
        const resultado =
          await carregarPrimeiroJsonDisponivel(
            CAMINHOS_INDICE
          );

        if (!validarIndice(resultado.json)) {
          throw new Error(
            'O índice deve conter uma propriedade "meses" com uma lista.'
          );
        }

        estadoAplicacao.indice = resultado.json;

        preencherSeletorMes(
          resultado.json.meses
        );

        if (resultado.caminho.endsWith('.txt')) {
          mostrarAviso(
            'O índice ainda está com extensão .txt. ' +
            'Renomeie-o para index.json.'
          );
        }

        await carregarMesSelecionado();
      } catch (erro) {
        elementos.areaConteudo.innerHTML = '';

        mostrarErro(
          `Não foi possível carregar o índice mensal: ${erro.message}`
        );
      }
    }

    async function carregarMesSelecionado() {
      limparErro();

      const indice = estadoAplicacao.indice;
      const indiceSelecionado =
        Number(elementos.seletorMes.value);

      if (
        !indice ||
        !Array.isArray(indice.meses) ||
        !indice.meses[indiceSelecionado]
      ) {
        mostrarErro(
          'Nenhum mês válido foi selecionado.'
        );

        return;
      }

      const mes = indice.meses[indiceSelecionado];

      const caminhos = obterCaminhosDoArquivo(
        mes.arquivo
      );

      if (caminhos.length === 0) {
        mostrarErro(
          'O mês selecionado não possui arquivo configurado.'
        );

        return;
      }

      elementos.areaConteudo.innerHTML =
        '<p class="carregando">Carregando informações...</p>';

      try {
        const resultado =
          await carregarPrimeiroJsonDisponivel(
            caminhos
          );

        if (!validarDadosMes(resultado.json)) {
          throw new Error(
            'O arquivo mensal não contém um objeto JSON válido.'
          );
        }

        estadoAplicacao.dadosMes = resultado.json;
        estadoAplicacao.arquivoAtual =
          resultado.caminho;

        if (resultado.caminho.endsWith('.txt')) {
          mostrarAviso(
            'O arquivo mensal ainda está com extensão .txt. ' +
            'Renomeie-o para .json.'
          );
        } else {
          limparAviso();
        }

        renderizarPagina(resultado.json);
      } catch (erro) {
        elementos.areaConteudo.innerHTML = '';

        mostrarErro(
          `Não foi possível carregar os dados do mês: ${erro.message}`
        );
      }
    }

    elementos.seletorMes.addEventListener(
      'change',
      carregarMesSelecionado
    );

    elementos.botaoAtualizar.addEventListener(
      'click',
      carregarIndice
    );

    configurarImagemCafe();
    carregarIndice();
  </script>
</body>
</html>
